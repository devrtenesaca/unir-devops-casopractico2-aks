apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-db
  template:
    metadata:
      labels:
        app: mongo-db
    spec:
      containers:
      - name: mongo
        image: mongo:7.0  # Use specific version, not :latest
        ports:
        - containerPort: 27017
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          exec:
            command: ["echo", "db.runCommand('ping').ok", "|", "mongosh", "localhost:27017/test", "--quiet"]
          initialDelaySeconds: 10
          periodSeconds: 10
---
# --- 2. MONGODB SERVICE (Internal) ---
apiVersion: v1
kind: Service
metadata:
  name: mongo-db  # This matches the name in your Python app: mongodb://mongo-db:27017/
spec:
  selector:
    app: mongo-db
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
# --- 3. PYTHON APP DEPLOYMENT ---