# --- 1. MONGODB DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-db
  template:
    metadata:
      labels:
        app: mongo-db
    spec:
      containers:
      - name: mongo
        image: mongo:7.0  # Use specific version, not :latest
        ports:
        - containerPort: 27017
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          exec:
            command: ["echo", "db.runCommand('ping').ok", "|", "mongosh", "localhost:27017/test", "--quiet"]
          initialDelaySeconds: 10
          periodSeconds: 10
---
# --- 2. MONGODB SERVICE (Internal) ---
apiVersion: v1
kind: Service
metadata:
  name: mongo-db  # This matches the name in your Python app: mongodb://mongo-db:27017/
spec:
  selector:
    app: mongo-db
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
# --- 3. PYTHON APP DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: blog-app
        # REPLACE THIS with your actual image path (e.g., youracr.azurecr.io/python-app:v1)
        image: acrmanal.azurecr.io/app-comments:v1
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          value: "mongodb://mongo-db:27017/"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        # Probes required by AKS Safeguards
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
---
# --- 4. PYTHON APP SERVICE (External) ---
apiVersion: v1
kind: Service
metadata:
  name: python-app-service
spec:
  type: LoadBalancer
  selector:
    app: python-app
  ports:
    - protocol: TCP
      port: 80      # The Port you type in the browser
      targetPort: 5000  # The Port Flask is listening on